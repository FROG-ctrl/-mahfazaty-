name: mahfazaty
description: "محفظتي - مصاريفك وسلفك وجمعياتك في مكان واحد"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lottie: ^3.3.1
  shared_preferences: ^2.3.0
  intl: any
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  flutter_local_notifications: ^19.5.0
  timezone: any
  flutter_timezone: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#047D65"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
